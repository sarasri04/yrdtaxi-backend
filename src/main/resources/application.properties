spring.application.name=yrdtaxi-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/yrdtaxi
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

server.port=8081
razorpay.key.id=rzp_test_xxxxxxxxxxxxxx
razorpay.key.secret=xxxxxxxxxxxxxxxxxxxx

# WhatsApp Cloud API
whatsapp.api-url=https://graph.facebook.com
whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.admin-number=${WHATSAPP_ADMIN_NUMBER}

# WhatsApp Webhook
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
whatsapp.app-secret=${WHATSAPP_APP_SECRET}

